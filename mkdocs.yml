site_name: BirdNET Geomodel
site_description: Spatiotemporal species occurrence prediction for post-filtering BirdNET acoustic detections
site_author: BirdNET-Team
site_url: https://birdnet-team.github.io/geomodel/

repo_name: birdnet-team/geomodel
repo_url: https://github.com/birdnet-team/geomodel

copyright: Copyright &copy; 2026 BirdNET-Team

theme:
  name: material
  logo: birdnet-logo-circle.png
  favicon: birdnet-logo-circle.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_category_heading: true
            heading_level: 3
            members_order: source
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Demo: demo/index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Data Pipeline:
      - Overview: pipeline/overview.md
      - GBIF Records: pipeline/gbif.md
      - Species: pipeline/taxonomy.md
      - Habitat and Population: pipeline/earthengine.md
      - Training File: pipeline/dataset.md
      - eBird Benchmark: pipeline/ebird.md
  - Model:
      - Architecture: model/architecture.md
      - Training: model/training.md
      - Scores: model/scores.md
      - Export and Inference: model/export.md
      - Upgrading from V3: model/upgrading.md
  - Evaluation:
      - Benchmark and GeoScore: evaluation/benchmark.md
      - Seasonality: evaluation/seasonality.md
      - Taxon Groups: evaluation/groups.md
      - Status and Trends: evaluation/status_trends.md
      - App Filter Study: evaluation/filter_study.md
      - Held-out Years: evaluation/held_out_years.md
      - Range Maps: evaluation/range_maps.md
  - API Reference:
      - model.model: api/model.md
      - model.loss: api/loss.md
      - model.io: api/io.md
  - Community:
      - Contributing: community/contributing.md
      - Code of Conduct: community/code-of-conduct.md
      - Acceptable Use: community/acceptable-use.md
      - Security: community/security.md
      - Citation: community/citation.md
